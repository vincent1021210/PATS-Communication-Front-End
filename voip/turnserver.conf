# PATS Coturn 設定範例
# 安裝：sudo apt install coturn
# 啟用：在 /etc/default/coturn 把 TURNSERVER_ENABLED=1
# 然後：sudo systemctl restart coturn
#
# 雲端防火牆要放行：
#   TCP/UDP 3478
#   UDP 49152-65535（媒體中繼埠）
# 若有 TLS，再加 TCP 5349。

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# 主機有公網 IP 時只填一個。主機在 NAT 後面時寫成 公網IP/內網IP
external-ip=YOUR_PUBLIC_IP

fingerprint
lt-cred-mech
realm=pats.local

# 請換成自己的帳號密碼。這組帳密會出現在前端 iceServers，請視為可被看到的中繼密碼，
# 不要拿去當其他系統的密碼。流量大時再改用 use-auth-secret 的短期憑證。
user=pats:change-this-password

min-port=49152
max-port=65535

total-quota=100
stale-nonce=600
no-multicast-peers
no-loopback-peers

log-file=/var/log/turnserver/turnserver.log
simple-log
